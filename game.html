<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game — Bearcat: No Tutorial</title>

  <style>
    :root {
      --red: #e00122;
      --black: #080808;
      --white: #ffffff;
      --gray: #666666;
      --light-gray: #f5f5f5;
      --border: #dcdcdc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: var(--white);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      padding: 34px 55px;
      display: flex;
      flex-direction: column;
    }

    /* NAVIGATION */

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .uc-mark {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .nav-button {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--red);
      transition: 0.2s ease;
    }

    .nav-button:hover {
      letter-spacing: 2.5px;
    }

    /* GAME AREA */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px 0 50px;
    }

    .label {
      width: 100%;
      max-width: 1100px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--red);
      margin-bottom: 12px;
    }

    #renpy-game {
      width: 100%;
      max-width: 1100px;
      height: min(65vh, 620px);
      background: var(--black);
      border: 1px solid var(--black);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-placeholder {
      text-align: center;
      color: white;
    }

    .big-text {
      font-size: clamp(35px, 5vw, 70px);
      line-height: 0.9;
      letter-spacing: -3px;
      font-weight: 900;
      margin-bottom: 25px;
    }

    .big-text span {
      color: var(--red);
    }

    .game-placeholder p {
      color: #aaaaaa;
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* PAGE NUMBER */

    .page-number {
      position: absolute;
      bottom: 34px;
      left: 55px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--gray);
    }

    @media (max-width: 800px) {
      body {
        overflow: auto;
      }

      .page {
        min-height: 100vh;
        height: auto;
        padding: 25px;
      }

      #renpy-game {
        height: 60vh;
      }

      .page-number {
        left: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- NAVIGATION -->

    <nav class="top-nav">

      <a href="index.html">
        <div class="uc-mark">UC</div>
      </a>

      <a href="tips.html" class="nav-button">
        ← BACK
      </a>

    </nav>


    <!-- GAME -->

    <main class="main">

      <div class="label">
        04 — PLAY THE GAME
      </div>

      <div id="renpy-game">

        <div class="game-placeholder">

          <div class="big-text">
            BEARCAT:<br>
            NO <span>TUTORIAL.</span>
          </div>

          <p>
            YOUR REN'PY GAME WILL RUN HERE.
          </p>

        </div>

      </div>

    </main>


    <div class="page-number">
      04 / 04
    </div>

  </div>

</body>
</html>
