<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game — Bearcat: No Tutorial</title>

  <style>
    :root {
      --red: #e00122;
      --black: #080808;
      --white: #ffffff;
      --gray: #666666;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background: var(--white);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      padding: 34px 55px;
      display: flex;
      flex-direction: column;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .uc-mark {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .nav-button {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--red);
      transition: 0.2s ease;
    }

    .nav-button:hover {
      letter-spacing: 2.5px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px 0 50px;
    }

    .label {
      width: 100%;
      max-width: 1100px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--red);
      margin-bottom: 12px;
    }

    #renpy-game {
      width: 100%;
      max-width: 1100px;
      height: min(65vh, 620px);
      background: #000000;
      border: 1px solid #000000;
      overflow: hidden;
    }

    #renpy-game iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000000;
    }

    .page-number {
      position: absolute;
      bottom: 34px;
      left: 55px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--gray);
    }

    @media (max-width: 800px) {
      body {
        overflow: auto;
      }

      .page {
        min-height: 100vh;
        height: auto;
        padding: 25px;
      }

      .main {
        padding: 25px 0 70px;
      }

      #renpy-game {
        width: 100%;
        height: 60vh;
        min-height: 400px;
      }

      .page-number {
        left: 25px;
        bottom: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <nav class="top-nav">

      <a href="index.html">
        <div class="uc-mark">UC</div>
      </a>

      <a href="tips.html" class="nav-button">
        ← BACK
      </a>

    </nav>

    <main class="main">

      <div class="label">
        04 — PLAY THE GAME
      </div>

      <div id="renpy-game">

        <iframe
          src="campusQuest/index.html"
          title="Bearcat: No Tutorial"
          allowfullscreen>
        </iframe>

      </div>

    </main>

    <div class="page-number">
      04 / 04
    </div>

  </div>

</body>
</html>
